# Neptune 4 Max / ZNP K1 V2.0: dedicated driver cooling on FAN4 / PA8.
# The owner moved this fan from FAN6 / PC7 to FAN4 on 2026-10-12.
# PC7 remains the hotend heatsink fan; FAN1 and FAN6 share that output.
# Motor enable includes stationary holding, which still heats the drivers.
[controller_fan driver_cooling]
pin: PA8
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
fan_speed: 1.0
idle_speed: 1.0
idle_timeout: 60
# Empty heater list: heating alone must not start this dedicated motor fan.
heater:
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, extruder
