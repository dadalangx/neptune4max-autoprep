# Pre-print-only addition. Does not replace G28, G29, [probe] or bed mesh.
# Requires adxl345_tap.py + adxl345_z_offset.py and the Tap Linux MCU binary.
[include adaptive_bed_mesh.cfg]

[adxl345_z_offset]
sensor: adxl345 x
threshold: 1.75
duration_ms: 20
axis: y
poll_rate: 2000
arm_delay: 0.120
speed: 25
accel: 300
probe_min_z: -3.5
pre_tap_lift: 5
tap_samples: 3
tap_samples_tolerance: 0.050
tap_samples_retries: 3
min_valid_contact_offset: 1.50
max_valid_contact_offset: 2.80
retract_dist: 5
retract_speed: 5
home_xy_position: 239.25, 194.55
home_z_position: 10
align_probe_to_nozzle: true
alignment_lift: 5
xy_speed: 200
manual_baseline: -2
max_offset_deviation: 0.5
contact_trim: 0
contact_fuzz: 3.0
contact_sample_groups: 3
mesh_profile: default
wipe_reference_offset: -2.0
# Bounded same-file, single-use authorization; allow legitimate 15x15 PA11 meshes.
wipe_session_timeout: 1800

#####################################################################
# Force touchscreen LOAD=11 to use the saved default mesh
#####################################################################
[gcode_macro BED_MESH_PROFILE]
rename_existing: BED_MESH_PROFILE_BASE
description: Redirect touchscreen LOAD=11 requests to the default mesh
gcode:
    {% set requested_profile = params.LOAD|default("") %}
    {% if requested_profile == "11" %}
        RESPOND TYPE=echo MSG="Touchscreen requested mesh 11. Loading default instead."
        BED_MESH_PROFILE_BASE LOAD=default
    {% else %}
        BED_MESH_PROFILE_BASE {rawparams}
    {% endif %}

[delayed_gcode FORCE_DEFAULT_BED_MESH]
initial_duration: 2.0
gcode:
    BED_MESH_PROFILE LOAD=default
    RESPOND TYPE=echo MSG="Default bed mesh loaded after startup."
