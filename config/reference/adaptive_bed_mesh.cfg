# Project-specific adaptive bed mesh for the Elegoo Neptune 4 Max.
#
# This intentionally does not rename or replace BED_MESH_CALIBRATE.  Bambu
# Studio supplies the first-layer bounds explicitly, so [exclude_object] and
# Moonraker object processing are not required.
[gcode_macro ADAPTIVE_BED_MESH]
description: Build a PA11 mesh around Bambu Studio first-layer bounds
variable_mesh_min_x: 20.0
variable_mesh_min_y: 30.0
variable_mesh_max_x: 395.0
variable_mesh_max_y: 400.0
variable_reference_x: 239.25
variable_reference_y: 194.55
variable_mesh_margin: 10.0
variable_adxl_contact_fuzz: 3.0
variable_probe_rounding_guard: 0.25
variable_base_probe_count_x: 15
variable_base_probe_count_y: 15
variable_fallback_probe_count: 6
gcode:
    ADAPTIVE_MESH_RESOLVE {rawparams}

# Internal builder: the public entry resolves Bambu PA calibration geometry
# from the active file first, then uses the unchanged KAMP-style algorithm.
[gcode_macro _ADAPTIVE_BED_MESH_BUILD]
gcode:
    {% set safe_min_x = printer["gcode_macro ADAPTIVE_BED_MESH"].mesh_min_x | float %}
    {% set safe_min_y = printer["gcode_macro ADAPTIVE_BED_MESH"].mesh_min_y | float %}
    {% set safe_max_x = printer["gcode_macro ADAPTIVE_BED_MESH"].mesh_max_x | float %}
    {% set safe_max_y = printer["gcode_macro ADAPTIVE_BED_MESH"].mesh_max_y | float %}
    {% set reference_x = printer["gcode_macro ADAPTIVE_BED_MESH"].reference_x | float %}
    {% set reference_y = printer["gcode_macro ADAPTIVE_BED_MESH"].reference_y | float %}
    {% set default_margin = printer["gcode_macro ADAPTIVE_BED_MESH"].mesh_margin | float %}
    {% set contact_fuzz = printer["gcode_macro ADAPTIVE_BED_MESH"].adxl_contact_fuzz | float %}
    {% set rounding_guard = printer["gcode_macro ADAPTIVE_BED_MESH"].probe_rounding_guard | float %}
    {% set base_count_x = printer["gcode_macro ADAPTIVE_BED_MESH"].base_probe_count_x | int %}
    {% set base_count_y = printer["gcode_macro ADAPTIVE_BED_MESH"].base_probe_count_y | int %}
    {% set fallback_count = printer["gcode_macro ADAPTIVE_BED_MESH"].fallback_probe_count | int %}
    {% set profile = params.PROFILE | default("adaptive") | string %}
    {% set plan_only = params.PLAN_ONLY | default(0) | int %}

    # PA11 is non-contact, so its mesh bounds are deterministic.  The extra
    # reference square only reserves coverage for the later fuzzed ADXL touch.
    {% set requested_margin = params.MARGIN | default(default_margin) | float %}
    {% set margin = [requested_margin, 0.0] | max %}

    {% set have_bounds = params.X_MIN is defined and
                         params.Y_MIN is defined and
                         params.X_MAX is defined and
                         params.Y_MAX is defined %}
    {% if have_bounds %}
        {% set model_min_x = params.X_MIN | float %}
        {% set model_min_y = params.Y_MIN | float %}
        {% set model_max_x = params.X_MAX | float %}
        {% set model_max_y = params.Y_MAX | float %}
        {% set valid_bounds = model_max_x > model_min_x and
                              model_max_y > model_min_y and
                              model_max_x >= safe_min_x and
                              model_min_x <= safe_max_x and
                              model_max_y >= safe_min_y and
                              model_min_y <= safe_max_y %}
    {% else %}
        {% set valid_bounds = false %}
    {% endif %}

    {% if valid_bounds %}
        # Union the expanded model area with the entire possible ADXL contact
        # square.  No randomness is applied to the PA11 mesh itself.
        {% set wanted_min_x = [model_min_x - margin, reference_x - contact_fuzz - rounding_guard] | min %}
        {% set wanted_min_y = [model_min_y - margin, reference_y - contact_fuzz - rounding_guard] | min %}
        {% set wanted_max_x = [model_max_x + margin, reference_x + contact_fuzz + rounding_guard] | max %}
        {% set wanted_max_y = [model_max_y + margin, reference_y + contact_fuzz + rounding_guard] | max %}
        {% set adapted_min_x = [wanted_min_x, safe_min_x] | max %}
        {% set adapted_min_y = [wanted_min_y, safe_min_y] | max %}
        {% set adapted_max_x = [wanted_max_x, safe_max_x] | min %}
        {% set adapted_max_y = [wanted_max_y, safe_max_y] | min %}

        # Preserve the configured 15x15 full-bed point spacing.  Smaller
        # areas use fewer points, never fewer than the interpolation permits.
        {% set spacing_x = (safe_max_x - safe_min_x) / (base_count_x - 1) %}
        {% set spacing_y = (safe_max_y - safe_min_y) / (base_count_y - 1) %}
        {% set points_x = (((adapted_max_x - adapted_min_x) / spacing_x) | round(method='ceil') | int) + 1 %}
        {% set points_y = (((adapted_max_y - adapted_min_y) / spacing_y) | round(method='ceil') | int) + 1 %}
        {% if [points_x, points_y] | max > 6 %}
            {% set algorithm = "bicubic" %}
            {% set min_points = 4 %}
        {% else %}
            {% set algorithm = "lagrange" %}
            {% set min_points = 3 %}
        {% endif %}
        {% set points_x = [[points_x, min_points] | max, base_count_x] | min %}
        {% set points_y = [[points_y, min_points] | max, base_count_y] | min %}
        {% set fallback = false %}
    {% else %}
        # Missing, malformed, or completely out-of-range slicer bounds must
        # not silently disable leveling.  Fall back to the factory-style 6x6.
        {% set adapted_min_x = safe_min_x %}
        {% set adapted_min_y = safe_min_y %}
        {% set adapted_max_x = safe_max_x %}
        {% set adapted_max_y = safe_max_y %}
        {% set points_x = fallback_count %}
        {% set points_y = fallback_count %}
        {% set algorithm = "bicubic" %}
        {% set fallback = true %}
    {% endif %}

    {% if fallback %}
        {action_respond_info("ADAPTIVE_BED_MESH: invalid Bambu Studio bounds; using safe full-bed fallback.")}
    {% endif %}
    {action_respond_info("ADAPTIVE_BED_MESH: deterministic PA11 bounds ({:.2f},{:.2f})..({:.2f},{:.2f}), points {}x{}, algorithm {}, margin {:.2f}, reserved ADXL contact fuzz +/-{:.2f} plus {:.2f} rounding guard, profile {}.".format(adapted_min_x, adapted_min_y, adapted_max_x, adapted_max_y, points_x, points_y, algorithm, margin, contact_fuzz, rounding_guard, profile))}

    {% if plan_only %}
        {action_respond_info("ADAPTIVE_BED_MESH: PLAN_ONLY=1; no motion performed.")}
    {% else %}
        ADAPTIVE_MESH_DRIFT_CALIBRATE PROFILE={profile} MESH_MIN={adapted_min_x},{adapted_min_y} MESH_MAX={adapted_max_x},{adapted_max_y} PROBE_COUNT={points_x},{points_y} ALGORITHM={algorithm}
    {% endif %}

# Time-interpolated PA11 center references, used by ADAPTIVE_BED_MESH only.
# Coordinates refer to the probe tip on the bed, not the nozzle.
# Actual XYZ homing is required after every Klipper restart.
[adaptive_mesh_drift]
reference_position: 215.0, 215.0
reference_interval: 5
condition_seconds: 180
max_reference_drift: 0.500
max_reference_jump: 0.080
