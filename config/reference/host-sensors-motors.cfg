# Reference excerpts only; merge after comparing the target machine.
# Motor constants and geometry are owner reference data, not universal specifications.

[printer]
kinematics:cartesian
max_velocity: 500
max_accel: 2000
max_accel_to_decel: 20000
max_z_velocity: 20
max_z_accel: 250
square_corner_velocity: 9.0



[bed_mesh]
speed:200                
horizontal_move_z:3     
mesh_min:20,30
mesh_max:395,400
probe_count:15,15          
algorithm:bicubic
bicubic_tension:0.2
mesh_pps: 2, 2   
fade_start:1
fade_end:10  


#####################################################################
# LED Control
#####################################################################


[motor_constants neptune4max-x-measured]
resistance: 2.2
inductance: 0.005
holding_torque: 0.4
max_current: 1.5
steps_per_revolution: 200


[motor_constants neptune4max-y-measured]
resistance: 0.98
inductance: 0.00190
holding_torque: 0.6
max_current: 2.5
steps_per_revolution: 200


[motor_constants neptune4max-z-custom]
resistance: 2.15
inductance: 0.0041
holding_torque: 0.3
max_current: 1.3
steps_per_revolution: 200


[mcu rpi]
serial: /tmp/klipper_host_mcu


[adxl345 x]
cs_pin: rpi:None
spi_bus: spidev0.0
axes_map:x,z,-y


[adxl345 y]
cs_pin: rpi:None
spi_bus: spidev0.1
axes_map:-x,-y,-z


[resonance_tester]
accel_chip_x: adxl345 x
accel_chip_y: adxl345 y
max_smoothing:1
min_freq: 5
max_freq: 90
accel_per_hz: 120
hz_per_sec: 2

probe_points:
    215, 215, 20  # an example


[gcode_macro M17]
gcode:
  {% if 'X' in params or 'Y' in params or 'Z' in params or 'E' in params %}
  {% if 'X' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
  {% endif %}
  {% if 'Y' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
  {% endif %}
  {% if 'Z' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_z enable=1
      SET_STEPPER_ENABLE STEPPER=stepper_z1 enable=1
  {% endif %}
  {% if 'E' in params %}
      SET_STEPPER_ENABLE STEPPER=extruder enable=1
  {% endif %}
  {% else %}
      SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
      SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
      SET_STEPPER_ENABLE STEPPER=stepper_z enable=1
      SET_STEPPER_ENABLE STEPPER=stepper_z1 enable=1
      #SET_STEPPER_ENABLE STEPPER=extruder enable=1
  {% endif %}




[gcode_macro M84]
rename_existing:M84.1
gcode:

  {% if 'X' in params or 'Y' in params or 'Z' in params or 'E' in params %}
  {% if 'X' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
  {% endif %}
  {% if 'Y' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
  {% endif %}
  {% if 'Z' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_z enable=0
      SET_STEPPER_ENABLE STEPPER=stepper_z1 enable=0
  {% endif %}
  {% if 'E' in params %}
      SET_STEPPER_ENABLE STEPPER=extruder enable=0
  {% endif %}
  {% else %}
      SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
      SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
      SET_STEPPER_ENABLE STEPPER=stepper_z enable=0
      SET_STEPPER_ENABLE STEPPER=stepper_z1 enable=0
      SET_STEPPER_ENABLE STEPPER=extruder enable=0
  {% endif %}

