# Owner reference excerpts. Merge into target configuration; do not include blindly.
# Calibration and limit values are machine-specific. Other vendor settings omitted.

[stepper_z]
step_pin:PC10
dir_pin:PA13
enable_pin: !PC11
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin:probe:z_virtual_endstop ## PB12 for Z-max; endstop have'!' is NO

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop:-5
position_max: 482.5
position_min: -5 
homing_speed: 8
homing_retract_dist: 5
second_homing_speed: 3

# Historical motor-side comments conflicted across files. Verify on the target machine.

[extruder]
step_pin:PA5
dir_pin:!PA6
enable_pin:!PA4
microsteps:16
rotation_distance: 29.0  #31.4	#Bondtech 5mm Drive Gears
gear_ratio: 52:10
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 310
heater_pin: PA7
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin: PA1
max_power: 1
#control : pid
#pid_kp : 25.989
#pid_ki : 3.397
#pid_kd : 49.705
pressure_advance: 0.020
pressure_advance_smooth_time: 0.04
instantaneous_corner_velocity: 2.5
max_extrude_only_distance: 300
max_extrude_only_velocity:60
max_extrude_only_accel:5000
max_extrude_cross_section: 9999999
min_extrude_temp:70


[fan]
pin: PB7
max_power: 0.70

# [fan_generic fan3]
# pin: PC9

# [fan_generic fan4]
# pin: PA8

# [fan_generic fan5]
# pin: PA15



[safe_z_home]
home_xy_position: 239.25,194.55 
speed: 200
z_hop: 10                 
z_hop_speed: 5



[gcode_macro G29]
gcode:
      M400
      BED_MESH_CLEAR
      # Level the independent Z motors before measuring the mesh.
      DUAL_Z_LEVEL
      BED_MESH_CALIBRATE profile=6 mesh_min=20,30 mesh_max=395,400 probe_count=6 algorithm=bicubic
      M400
      G4 P2000
      G91 
      G1 Z5 F300 
      G90
      G28 Z
      G1 X215 Y215 F12000
      G1 Z0 F300

#####################################################################
# 	Probe
#####################################################################


[probe]
pin:^PA11
x_offset: -24.25
y_offset: 20.45
z_offset: 0.0
speed: 8
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.03
samples_tolerance_retries: 10


[tmc2209 stepper_z]
uart_pin: PC5
# Original Z socket drives one motor. Determine physical side by observation.
run_current: 0.6
#hold_current: 0.5
interpolate: True
stealthchop_threshold: 0


[autotune_tmc stepper_x]
motor: neptune4max-x-measured
sg4_thrs: 90


[autotune_tmc stepper_y]
motor: neptune4max-y-measured
sg4_thrs: 80

# Z autotune disabled; retain the motor constants above for reference.
#[autotune_tmc stepper_z]
#motor: neptune4max-z-custom
#[autotune_tmc stepper_z1]
#motor: neptune4max-z-custom

[autotune_tmc extruder]
motor: qidi-BJY36D12-04V13


[virtual_sdcard]
path: ~/gcode_files
on_error_gcode: 
    SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
    # test OK
    G91
    G1 Z25 F900
    G90
    TURN_OFF_HEATERS
    M106 S100
    M84
    M300 P10000 S1
    G4 P300
    M300
    M300
    M300
    M300
    M300
    M300
    M300
    M300
    M300
    M300
    M300


########################################
# PRINT_START/CANCEL_PRINT/PAUSE/RESUME/filament_switch_sensor
########################################


[output_pin beeper]
pin: PA2
pwm: true
shutdown_value:0
value:0.0


