# Neptune 4 Max / ZNP K1 V2.0 independent Z, 2026-10-09
# Owner-confirmed reference, facing the printer: original Z = LEFT; E1 = RIGHT.
# Every recipient machine must verify its own sides and positive motion.
# The top synchronizing belt has been removed by the owner.
# Reference direction settings raise both sides; confirm on the target machine.
[stepper_z1]
step_pin: PB1
dir_pin: !PB2
enable_pin: !PB0
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200

# MKS TMC2209 V2.0 replacement, owner verified, 2026-10-12.
# Two R110 current-sense resistors: use 0.110 ohm.
# E1: UART jumper only; leave the other jumper positions open.
[tmc2209 stepper_z1]
uart_pin: PB6
uart_address: 0
sense_resistor: 0.110
run_current: 0.6
#hold_current: 0.5
interpolate: True
stealthchop_threshold: 0
# Both motors follow normal Z moves and share the existing PA11 probe endstop.

# Leadscrew center-to-center distance measured by owner: 480 mm.
# Absolute X origin is estimated by centering that span on the 430 mm bed.
# The common X-origin error affects common Z only, not left/right correction;
# DUAL_Z_LEVEL always re-homes Z after adjustment to establish the Z reference.
# Reference order is LEFT original Z first, then RIGHT E1.
# Set this order from the recipient machine's observed stepper_z / stepper_z1 mapping.
[z_tilt]
z_positions:
    -25, 215
    455, 215
# NOZZLE coordinates: three nearby positions per side, around Y=194.55.
# Each side covers only 20 mm in Y (+/-10 mm from the old center).
# PA11 probe coordinates: X=45.75/375.75, Y=205/215/225.
# Probe offsets: X=-24.25, Y=20.45. Snake order avoids extra travel.
points:
    70, 184.55
    70, 194.55
    70, 204.55
    400, 204.55
    400, 194.55
    400, 184.55
speed: 80
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.03

[gcode_macro DUAL_Z_LEVEL]
description: Home, level the independent Z motors using PA11, and home Z again
gcode:
    # Abort before motion if the added driver does not answer UART.
    DUMP_TMC STEPPER=stepper_z1
    DUMP_TMC STEPPER=stepper_z
    G90
    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    # Vendor startup fabricates homed_axes, so always perform a real full home.
    G28
    Z_TILT_ADJUST
    G28 Z
    # Previous meshes must be regenerated after changing the gantry alignment.
    BED_MESH_CLEAR
    G1 Z10 F300
    RESPOND TYPE=echo MSG="Dual Z leveled. Rebuild bed mesh before printing."

# Existing slicer sequence: PREPARE_WIPE -> wipe -> ADAPTIVE_BED_MESH -> ADXL.
# The original command heats/soaks and establishes its one-use wipe session.
# Level after it returns (bed is hot), before the later mesh/calibration.
# DUAL_Z_LEVEL clears stale mesh/offset; restore only the configured wipe offset.
[gcode_macro ADXL_Z_OFFSET_PREPARE_WIPE]
rename_existing: ADXL_Z_OFFSET_PREPARE_WIPE_BASE
description: Prepare the hot bed and wipe session, then level independent Z
gcode:
    ADXL_Z_OFFSET_PREPARE_WIPE_BASE {rawparams}
    DUAL_Z_LEVEL
    SET_GCODE_OFFSET Z={printer.configfile.settings.adxl345_z_offset.wipe_reference_offset} MOVE=0
