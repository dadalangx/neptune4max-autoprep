# Neptune 4 Max / ZNP K1 V2.0, 2026-10-10.
# FAN2 / PB7 remains the existing [fan] for part cooling.
# FAN3 / PC9 is independently controlled by Bambu Studio M106 P2.
[fan_generic auxiliary_fan]
pin: PC9
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5

[gcode_macro M106]
rename_existing: M99106
description: Route main and auxiliary cooling fan commands independently
gcode:
    {% set p = params.P|default(0)|int %}
    {% set requested = params.S|default(255)|float %}
    {% set s = ([0.0, requested]|max, 255.0)|min %}
    {% if p == 2 %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED={s / 255.0}
    {% elif p == 0 or p == 1 %}
        # PB7 [fan].max_power maps the input range to 0-70% PWM output.
        M99106 S{s}
    {% else %}
        RESPOND TYPE=echo MSG="Fan P{p} is not configured. Command ignored."
    {% endif %}

[gcode_macro M107]
rename_existing: M99107
description: Stop a selected cooling fan, or both when P is omitted
gcode:
    {% if 'P' in params %}
        {% set p = params.P|int %}
        {% if p == 2 %}
            SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
        {% elif p == 0 or p == 1 %}
            M99107
        {% else %}
            RESPOND TYPE=echo MSG="Fan P{p} is not configured. Command ignored."
        {% endif %}
    {% else %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
        M99107
    {% endif %}
