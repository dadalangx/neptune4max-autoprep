# Neptune 4 Max maintenance macro, 2026-10-10.
# Auxiliary fan: FAN3 / PC9, defined by bambu_aux_fan.cfg.
[gcode_macro COLD_PULL]
description: Home, raise to Z200, purge at 250C, cool to 110C/90C and pull
gcode:
    {% set cfg = printer.configfile.settings %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("COLD_PULL requires an idle printer.")}
    {% endif %}
    {% if cfg.extruder.min_extrude_temp|float > 90 %}
        {action_raise_error("The configured minimum extrusion temperature does not permit the 90C pull.")}
    {% endif %}
    {% if cfg.extruder.max_temp|float <= 250 %}
        {action_raise_error("The configured nozzle temperature limit does not permit 250C.")}
    {% endif %}
    {% if cfg.extruder.max_extrude_only_distance|float < 150 %}
        {action_raise_error("The configured extrusion distance limit does not permit a 150mm purge.")}
    {% endif %}
    {% if cfg.stepper_z.position_max|float < 200 %}
        {action_raise_error("The configured Z travel does not permit Z200.")}
    {% endif %}
    M400
    SAVE_GCODE_STATE NAME=COLD_PULL_STATE
    M220 S100
    M221 S100
    G90
    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    M106 P2 S0

    RESPOND TYPE=echo MSG="Cold pull: homing and raising to Z200."
    G28
    G1 Z200 F600
    M400

    RESPOND TYPE=echo MSG="Cold pull: heating to 250C and purging 150mm at 3mm/s."
    M109 S250
    M83
    G1 E150 F180
    M400

    # Flush extrusion before enabling the auxiliary fan and lowering the target.
    M106 P2 S255
    M104 S110
    RESPOND TYPE=echo MSG="Cold pull: auxiliary fan on. Cooling to 110C."
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=110
    M106 P2 S0

    # A new target is required here; leaving it at 110 would prevent cooling.
    M104 S90
    RESPOND TYPE=echo MSG="Cold pull: auxiliary fan off. Cooling to 90C."
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=90
    G1 E-30 F60
    M400
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

    M104 S90
    RESTORE_GCODE_STATE NAME=COLD_PULL_STATE MOVE=0
    COLD_PULL_BEEP
    RESPOND TYPE=echo MSG="Cold pull complete. Nozzle target held at 90C and extruder motor off."

[gcode_macro COLD_PULL_BEEP]
description: Two short beeps at the owner-selected PWM duty
variable_duty: 0.50
gcode:
    {% set level = params.DUTY|default(duty)|float %}
    {% if level < 0 or level > 0.50 %}
        {action_raise_error("COLD_PULL_BEEP DUTY must be between 0 and 0.50.")}
    {% endif %}
    {% set scale = printer.configfile.settings['output_pin beeper'].scale|default(1.0)|float %}
    # The owner selected 50% after listening to 1%, 2%, 20% and 50%.
    # Keep each beep short (100ms), with a 150ms gap.
    # PWM duty is not a calibrated acoustic volume percentage.
    SET_PIN PIN=beeper VALUE={level * scale} CYCLE_TIME=0.001
    G4 P100
    SET_PIN PIN=beeper VALUE=0 CYCLE_TIME=0.001
    G4 P150
    SET_PIN PIN=beeper VALUE={level * scale} CYCLE_TIME=0.001
    G4 P100
    SET_PIN PIN=beeper VALUE=0 CYCLE_TIME=0.001
    M400
